<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>اللائحة — Chrili</title>
<style>
  :root{
    --teal:#1D9E75;
    --teal-dark:#0F6E56;
    --teal-light:#E1F5EE;
    --amber:#EF9F27;
    --amber-dark:#854F0B;
    --amber-light:#FAEEDA;
    --blue:#378ADD;
    --blue-dark:#0C447C;
    --blue-light:#E6F1FB;
    --bg:#FAFAF8;
    --card-bg:#FFFFFF;
    --ink:#22221F;
    --ink-soft:#6B6A63;
    --border:#E7E5DE;
    --radius:18px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI', 'Tahoma', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:2rem;
  }

  header{
    padding:1.1rem 1.25rem;
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    align-items:center;
    gap:0.75rem;
  }

  .back-btn{
    width:38px;
    height:38px;
    border-radius:12px;
    background:var(--blue-light);
    color:var(--blue-dark);
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    flex-shrink:0;
  }

  .back-btn svg{ width:20px; height:20px; }

  header h1{
    font-size:1.1rem;
    font-weight:700;
    flex:1;
  }

  .count-badge{
    background:var(--blue-light);
    color:var(--blue-dark);
    font-size:0.8rem;
    font-weight:700;
    padding:0.3rem 0.65rem;
    border-radius:999px;
  }

  main{
    padding:1rem 1.25rem;
    max-width:520px;
    margin:0 auto;
  }

  .category-group{ margin-bottom:1.4rem; }

  .category-label{
    font-size:0.85rem;
    font-weight:700;
    color:var(--ink-soft);
    margin:0 0.25rem 0.6rem;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:0.55rem;
  }

  .item-row{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:0.7rem 0.85rem;
    display:flex;
    align-items:center;
    gap:0.75rem;
    transition:opacity 0.15s ease;
  }

  .item-row.checked{ opacity:0.45; }
  .item-row.checked .item-name{ text-decoration:line-through; }

  .check-btn{
    width:26px;
    height:26px;
    border-radius:8px;
    border:1.5px solid var(--border);
    background:var(--bg);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    color:#fff;
  }

  .check-btn.on{
    background:var(--teal);
    border-color:var(--teal);
  }

  .check-btn svg{ width:15px; height:15px; }

  .item-info{ flex:1; min-width:0; }
  .item-name{ font-size:0.95rem; font-weight:600; }
  .item-qty{ font-size:0.8rem; color:var(--ink-soft); margin-top:1px; }
  .item-note{ font-size:0.78rem; color:var(--amber-dark); margin-top:2px; font-style:italic; }

  .del-btn{
    width:32px;
    height:32px;
    border-radius:9px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }

  .del-btn svg{ width:18px; height:18px; }

  .empty-state{
    text-align:center;
    padding:3rem 1.5rem;
    color:var(--ink-soft);
  }

  .empty-state svg{ width:48px; height:48px; margin-bottom:0.85rem; opacity:0.5; }
  .empty-state p{ font-size:0.92rem; margin-bottom:1rem; }

  .empty-state a{
    display:inline-block;
    padding:0.6rem 1.1rem;
    background:var(--teal);
    color:#fff;
    text-decoration:none;
    border-radius:12px;
    font-size:0.88rem;
    font-weight:700;
  }

  .actions-row{
    display:flex;
    gap:0.6rem;
    margin-top:0.5rem;
  }

  .clear-btn, .share-btn{
    flex:1;
    padding:0.75rem;
    border-radius:14px;
    font-size:0.88rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    text-align:center;
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.4rem;
  }

  .clear-btn{
    background:var(--card-bg);
    border:1px solid var(--border);
    color:var(--ink-soft);
  }

  .share-btn{
    background:var(--teal);
    color:#fff;
  }

  .share-btn svg{ width:18px; height:18px; }

  /* Toast */
  .toast{
    position:fixed;
    bottom:1.5rem;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:0.7rem 1.2rem;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    z-index:60;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* Capture preview overlay */
  .capture-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:1rem;
  }

  .capture-overlay.open{ display:flex; }

  .capture-content{
    background:var(--bg);
    border-radius:18px;
    max-width:95%;
    max-height:85vh;
    overflow:auto;
    padding:1.25rem;
    position:relative;
  }

  .capture-content .close-capture{
    position:sticky;
    top:0;
    float:left;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:50%;
    width:32px;
    height:32px;
    font-size:1.2rem;
    cursor:pointer;
    z-index:5;
  }

  .capture-list{
    padding:0.25rem 0.5rem;
  }

  /* ===== THREE COLUMN GRID FOR CAPTURE ===== */
  .capture-list .category-label{
    font-size:0.75rem;
    font-weight:700;
    color:var(--ink-soft);
    margin:0.4rem 0 0.2rem;
    grid-column: 1 / -1;
  }

  .capture-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:0.25rem;
  }

  .capture-grid .item-row{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:6px;
    padding:0.25rem 0.3rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:0.1rem;
    font-size:0.65rem;
    min-height:40px;
    justify-content:center;
  }

  .capture-grid .item-row .item-name{
    font-size:0.68rem;
    font-weight:600;
    line-height:1.2;
    max-width:100%;
    word-break:break-word;
  }

  .capture-grid .item-row .item-qty{
    font-size:0.6rem;
    color:var(--ink-soft);
    font-weight:500;
  }

  .capture-grid .item-row .item-check{
    font-size:0.55rem;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn" aria-label="رجوع">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 9 12l6 6"/></svg>
  </a>
  <h1>اللائحة</h1>
  <span class="count-badge" id="countBadge">0</span>
</header>

<main id="main"></main>

<!-- Toast Notification -->
<div class="toast" id="toast">تمت المشاركة</div>

<!-- Capture Preview Overlay -->
<div class="capture-overlay" id="captureOverlay">
  <div class="capture-content" id="captureContent">
    <button class="close-capture" id="closeCapture">✕</button>
    <div id="capturePreview"></div>
    <div style="display:flex; gap:0.6rem; margin-top:0.75rem;">
      <button class="clear-btn" id="shareCaptureBtn" style="flex:1; background:var(--teal); color:#fff; border:none; padding:0.7rem; border-radius:12px; font-weight:700;">📤 مشاركة</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'chrili-shopping-list';
  const main = document.getElementById('main');
  const countBadge = document.getElementById('countBadge');
  const toast = document.getElementById('toast');
  const captureOverlay = document.getElementById('captureOverlay');
  const capturePreview = document.getElementById('capturePreview');
  const closeCapture = document.getElementById('closeCapture');
  const shareCaptureBtn = document.getElementById('shareCaptureBtn');

  let toastTimer = null;

  function getList(){
    return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  }

  function saveList(list){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function unitLabel(entry){
    if(entry.unit === 'money') return `${entry.amount} دج`;
    if(entry.unit === 'weight') return `${entry.weight} غ`;
    if(entry.unit === 'kg') return `${entry.qty} كغ`;
    return `${entry.qty} قطعة`;
  }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function render(){
    const list = getList();
    countBadge.textContent = list.length;

    if(list.length === 0){
      main.innerHTML = `
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <p>اللائحة فارغة، زيد شي حاجة من الأقسام.</p>
          <a href="index.html">رجوع للأقسام</a>
        </div>
      `;
      return;
    }

    const groups = {};
    list.forEach(entry => {
      if(!groups[entry.category]) groups[entry.category] = [];
      groups[entry.category].push(entry);
    });

    let html = '';
    Object.keys(groups).forEach(category => {
      html += `<div class="category-group"><p class="category-label">${category}</p><div class="list">`;
      groups[category].forEach(entry => {
        html += `
          <div class="item-row ${entry.checked ? 'checked' : ''}" data-name="${entry.name}" data-category="${entry.category}">
            <button type="button" class="check-btn ${entry.checked ? 'on' : ''}" data-action="check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
            </button>
            <div class="item-info">
              <div class="item-name">${entry.name}</div>
              <div class="item-qty">${unitLabel(entry)}</div>
              ${entry.note ? `<div class="item-note">${entry.note}</div>` : ''}
            </div>
            <button type="button" class="del-btn" data-action="delete" aria-label="حذف">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-1 13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 7"/></svg>
            </button>
          </div>
        `;
      });
      html += `</div></div>`;
    });

    html += `
      <div class="actions-row">
        <button type="button" class="share-btn" id="shareBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
          مشاركة
        </button>
        <button type="button" class="clear-btn" id="clearBtn">تفريغ اللائحة</button>
      </div>
    `;

    main.innerHTML = html;

    main.querySelectorAll('[data-action="check"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const row = e.currentTarget.closest('.item-row');
        toggleChecked(row.dataset.name, row.dataset.category);
      });
    });

    main.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const row = e.currentTarget.closest('.item-row');
        deleteItem(row.dataset.name, row.dataset.category);
      });
    });

    document.getElementById('shareBtn').addEventListener('click', openCapture);
    document.getElementById('clearBtn').addEventListener('click', () => {
      if(confirm('هل أنت متأكد من تفريغ اللائحة؟')) {
        saveList([]);
        render();
        showToast('تم تفريغ اللائحة');
      }
    });
  }

  function toggleChecked(name, category){
    const list = getList();
    const entry = list.find(e => e.name === name && e.category === category);
    if(entry){
      entry.checked = !entry.checked;
      saveList(list);
      render();
    }
  }

  function deleteItem(name, category){
    let list = getList();
    list = list.filter(e => !(e.name === name && e.category === category));
    saveList(list);
    render();
    showToast('تم الحذف');
  }

  // ====== SCREENSHOT / SHARE ======
  function openCapture(){
    const list = getList();
    if(list.length === 0){
      showToast('اللائحة فارغة');
      return;
    }

    const groups = {};
    list.forEach(entry => {
      if(!groups[entry.category]) groups[entry.category] = [];
      groups[entry.category].push(entry);
    });

    let html = `<div class="capture-list">`;

    Object.keys(groups).forEach(category => {
      html += `<p class="category-label">${category}</p>`;
      html += `<div class="capture-grid">`;
      groups[category].forEach(entry => {
        const checkMark = entry.checked ? '✅' : '';
        html += `
          <div class="item-row">
            <span class="item-check">${checkMark}</span>
            <span class="item-name">${entry.name}</span>
            <span class="item-qty">${unitLabel(entry)}</span>
          </div>
        `;
      });
      html += `</div>`;
    });

    html += `</div>`;

    capturePreview.innerHTML = html;
    captureOverlay.classList.add('open');
  }

  closeCapture.addEventListener('click', () => {
    captureOverlay.classList.remove('open');
  });

  captureOverlay.addEventListener('click', (e) => {
    if(e.target === captureOverlay) captureOverlay.classList.remove('open');
  });

  shareCaptureBtn.addEventListener('click', () => {
    const element = capturePreview;
    
    if(typeof html2canvas !== 'undefined'){
      html2canvas(element, {
        scale: 2,
        backgroundColor: '#FAFAF8',
        borderRadius: '18px',
        allowTaint: true,
        useCORS: true
      }).then(canvas => {
        const dataUrl = canvas.toDataURL('image/png');
        shareImage(dataUrl);
      }).catch(err => {
        console.error(err);
        shareTextFallback();
      });
    } else {
      shareTextFallback();
    }
  });

  function shareImage(dataUrl){
    if(navigator.share && navigator.canShare){
      const blob = dataURLToBlob(dataUrl);
      const file = new File([blob], 'shopping-list.png', { type: 'image/png' });
      navigator.share({
        title: 'قائمة التسوق',
        files: [file]
      }).then(() => {
        captureOverlay.classList.remove('open');
        showToast('تمت المشاركة ✅');
      }).catch(err => {
        if(err.name !== 'AbortError'){
          console.error(err);
          shareTextFallback();
        }
      });
    } else {
      downloadImage(dataUrl);
      captureOverlay.classList.remove('open');
      showToast('تم تحميل الصورة ');
    }
  }

  function shareTextFallback(){
    const list = getList();
    let text = ' قائمة التسوق - Chrili\n' + '='.repeat(30) + '\n';
    const groups = {};
    list.forEach(entry => {
      if(!groups[entry.category]) groups[entry.category] = [];
      groups[entry.category].push(entry);
    });
    Object.keys(groups).forEach(cat => {
      text += `\n📂 ${cat}:\n`;
      groups[cat].forEach(entry => {
        text += `  ${entry.checked ? '✅' : '⬜'} ${entry.name} — ${unitLabel(entry)}\n`;
      });
    });
    text += '\n' + '='.repeat(30);

    if(navigator.share){
      navigator.share({ title: 'قائمة التسوق', text: text })
        .then(() => showToast('تمت المشاركة '))
        .catch(() => copyToClipboard(text));
    } else {
      copyToClipboard(text);
    }
    captureOverlay.classList.remove('open');
  }

  function copyToClipboard(text){
    navigator.clipboard.writeText(text).then(() => {
      showToast('تم نسخ القائمة ');
    }).catch(() => {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      document.body.removeChild(textarea);
      showToast('تم نسخ القائمة ');
    });
  }

  function downloadImage(dataUrl){
    const link = document.createElement('a');
    link.download = 'shopping-list.png';
    link.href = dataUrl;
    link.click();
  }

  function dataURLToBlob(dataUrl){
    const parts = dataUrl.split(';base64,');
    const byteString = atob(parts[1]);
    const mimeType = parts[0].split(':')[1];
    const ab = new ArrayBuffer(byteString.length);
    const ia = new Uint8Array(ab);
    for(let i=0; i<byteString.length; i++){
      ia[i] = byteString.charCodeAt(i);
    }
    return new Blob([ab], { type: mimeType });
  }

  function loadHtml2Canvas(){
    if(typeof html2canvas === 'undefined'){
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
      document.head.appendChild(script);
    }
  }
  loadHtml2Canvas();

  render();
</script>

</body>
</html>
