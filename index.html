<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Chrili</title>
<style>
  :root{
    --teal:#1D9E75;
    --teal-dark:#0F6E56;
    --teal-light:#E1F5EE;
    --amber:#EF9F27;
    --amber-dark:#854F0B;
    --amber-light:#FAEEDA;
    --blue:#378ADD;
    --blue-dark:#0C447C;
    --blue-light:#E6F1FB;
    --bg:#FAFAF8;
    --card-bg:#FFFFFF;
    --ink:#22221F;
    --ink-soft:#6B6A63;
    --border:#E7E5DE;
    --radius:18px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI', 'Tahoma', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:2rem;
  }

  header{
    padding:1.75rem 1.25rem 1.25rem;
    background:linear-repeat, var(--card-bg);
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:10;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:0.65rem;
  }

  .brand-mark{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }

  .brand-mark svg{ width:24px; height:24px; }

  .brand-text h1{
    font-size:1.35rem;
    font-weight:700;
    letter-spacing:0.2px;
  }

  .brand-text p{
    font-size:0.8rem;
    color:var(--ink-soft);
    margin-top:1px;
  }

  .header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:0.75rem;
  }

  .list-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--amber-light);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:var(--amber-dark);
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;
    transition:transform 0.12s ease;
  }

  .list-btn:active{ transform:scale(0.94); }

  .list-btn svg{ width:22px; height:22px; }

  main{
    padding:1.25rem;
    max-width:520px;
    margin:0 auto;
  }

  .section-label{
    font-size:0.95rem;
    font-weight:700;
    color:var(--ink);
    margin:0.5rem 0.25rem 0.85rem;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:0.85rem;
  }

  .card{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    text-decoration:none;
    color:inherit;
    display:flex;
    flex-direction:column;
    -webkit-tap-highlight-color:transparent;
    transition:transform 0.12s ease;
  }

  .card:active{
    transform:scale(0.97);
  }

  .card-image{
    aspect-ratio:1.3 / 1;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  .card-image img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .card-image .placeholder-icon{
    opacity:0.55;
  }

  .card-image .placeholder-icon svg{
    width:30px;
    height:30px;
  }

  .card-title{
    padding:0.65rem 0.75rem 0.8rem;
    font-size:0.92rem;
    font-weight:600;
    line-height:1.3;
  }

  /* three-color rotation for card image backgrounds */
  .card:nth-child(3n+1) .card-image{ background:var(--teal-light); }
  .card:nth-child(3n+1) .placeholder-icon{ color:var(--teal-dark); }

  .card:nth-child(3n+2) .card-image{ background:var(--amber-light); }
  .card:nth-child(3n+2) .placeholder-icon{ color:var(--amber-dark); }

  .card:nth-child(3n+3) .card-image{ background:var(--blue-light); }
  .card:nth-child(3n+3) .placeholder-icon{ color:var(--blue-dark); }

  .add-card{
    background:var(--card-bg);
    border:1.5px dashed var(--border);
    border-radius:var(--radius);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    aspect-ratio:1.3/1;
    color:var(--ink-soft);
    gap:0.4rem;
    grid-column:1 / -1;
    padding:1.4rem;
    text-decoration:none;
  }

  .add-card svg{ width:26px; height:26px; }

  .add-card span{ font-size:0.85rem; font-weight:600; }

  footer{
    text-align:center;
    padding:1.5rem 1rem 0.5rem;
    font-size:0.75rem;
    color:var(--ink-soft);
  }

  /* add-category overlay */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(34,34,31,0.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }

  .overlay.open{ display:flex; }

  .add-panel{
    background:var(--card-bg);
    width:100%;
    max-width:520px;
    border-radius:22px 22px 0 0;
    padding:1.5rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
  }

  .add-panel-title{
    font-size:1.05rem;
    font-weight:700;
    margin-bottom:1.1rem;
  }

  .field-label{
    display:block;
    font-size:0.82rem;
    font-weight:600;
    color:var(--ink-soft);
    margin:0.9rem 0 0.4rem;
  }

  .field-input{
    width:100%;
    padding:0.7rem 0.85rem;
    border:1px solid var(--border);
    border-radius:12px;
    font-size:0.95rem;
    font-family:inherit;
    background:var(--bg);
    color:var(--ink);
  }

  .field-input:focus{
    outline:none;
    border-color:var(--teal);
  }

  .panel-actions{
    display:flex;
    gap:0.75rem;
    margin-top:1.4rem;
  }

  .btn-cancel, .btn-save{
    flex:1;
    padding:0.75rem;
    border-radius:12px;
    font-size:0.92rem;
    font-weight:700;
    font-family:inherit;
    border:none;
    cursor:pointer;
  }

  .btn-cancel{
    background:var(--bg);
    color:var(--ink-soft);
    border:1px solid var(--border);
  }

  .btn-save{
    background:var(--teal);
    color:#fff;
  }

  .btn-save:active, .btn-cancel:active{
    transform:scale(0.97);
  }

  .toast{
    position:fixed;
    bottom:1.5rem;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--ink);
    color:#fff;
    padding:0.7rem 1.2rem;
    border-radius:999px;
    font-size:0.85rem;
    font-weight:600;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease;
    z-index:60;
    white-space:nowrap;
  }

  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
          <path d="M3 6h18"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>Chrili</h1>
      </div>
    </div>

    <a href="list.html" class="list-btn" aria-label="لائحة المنتجات">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 6h11M9 12h11M9 18h11"/>
        <path d="M4 6h.01M4 12h.01M4 18h.01"/>
      </svg>
    </a>
  </div>
</header>

<main>
  <p class="section-label">الأقسام</p>

  <div class="grid">

    <a href="vegetables.html" class="card">
      <div class="card-image">
        <img src="https://cdn.britannica.com/17/196817-050-6A15DAC3/vegetables.jpg?w=400&h=300&c=crop" alt="خضر">
      </div>
      <div class="card-title">خضر</div>
    </a>

    <a href="fruits.html" class="card">
      <div class="card-image">
        <img src="https://new-server.developingexperts.com/file-cdn/images/get/10327817-17cf-4578-97e1-704cbadb8a01?transform=resize:340x_~fit:contain;format:webp;quality:80" alt="فواكه">
      </div>
      <div class="card-title">فواكه</div>
    </a>

    <a href="meat.html" class="card">
      <div class="card-image">
        <img src="https://cdn.britannica.com/72/143572-050-87DF1262/pork-butcher-shop-Hong-Kong.jpg" alt="لحم">
      </div>
      <div class="card-title">لحم</div>
    </a>

    <a href="groceries.html" class="card">
      <div class="card-image">
        <img src="https://www.sciencesetavenir.fr/assets/img/2018/04/12/cover-r4x3w1200-5acf35a316a27-des-additifs-dans-nos-yaourts.jpg" alt="مواد غذائية">
      </div>
      <div class="card-title">مواد غذائية</div>
    </a>

    <a href="spices.html" class="card">
      <div class="card-image">
        <img src="https://nyspiceshop.com/cdn/shop/articles/SPICES_VS._SEASONING.jpeg?v=1568991269" alt="عطار">
      </div>
      <div class="card-title">عطار</div>
    </a>

    <a href="cleaning.html" class="card">
      <div class="card-image">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSb67256nlsyabOCZ8KqIWoLm4LK-iqXU70BHG3jqZciRvmSw8yTvem2GU&s=10" alt="منتجات التنظيف">
      </div>
      <div class="card-title">منتجات التنظيف</div>
    </a>

    <a href="#" id="addProductBtn" class="card" aria-label="اضافة منتج">
      <div class="card-image">
        <span class="placeholder-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="36" height="36" aria-hidden="true">
  <path d="M12 5v14M5 12h14"/>
</svg>
        </span>
      </div>
      <div class="card-title">اضافة</div>
    </a>

    <a href="bakery.html" class="card">
      <div class="card-image">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Korb_mit_Br%C3%B6tchen.JPG/1280px-Korb_mit_Br%C3%B6tchen.JPG" alt="خبز">
      </div>
      <div class="card-title">خبز</div>
    </a>

  </div>
</main>

<div class="overlay" id="overlay">
  <div class="add-panel">
    <p class="add-panel-title">إضافة منتج</p>

    <label class="field-label" for="productName">اسم المنتج</label>
    <input type="text" id="productName" class="field-input" placeholder="مثال: خبز طري">

    <label class="field-label" for="productNote">ملاحظة (اختياري)</label>
    <input type="text" id="productNote" class="field-input" placeholder="مثال: بدون سكر">

    <div class="panel-actions">
      <button type="button" class="btn-cancel" id="cancelBtn">إلغاء</button>
      <button type="button" class="btn-save" id="saveBtn">إضافة إلى اللائحة</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">تمت الإضافة إلى اللائحة</div>

<script>
  const addProductBtn = document.getElementById('addProductBtn');
  const overlay = document.getElementById('overlay');
  const cancelBtn = document.getElementById('cancelBtn');
  const saveBtn = document.getElementById('saveBtn');
  const productName = document.getElementById('productName');
  const productNote = document.getElementById('productNote');
  const toast = document.getElementById('toast');

  const LIST_STORAGE_KEY = 'chrili-shopping-list';
  const CATEGORY = 'أخرى';

  let toastTimer = null;

  function showToast(message){
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }

  function openPanel(){
    overlay.classList.add('open');
    productName.value = '';
    productNote.value = '';
    setTimeout(() => productName.focus(), 50);
  }

  function closePanel(){
    overlay.classList.remove('open');
  }

  addProductBtn.addEventListener('click', (e) => {
    e.preventDefault();
    openPanel();
  });

  cancelBtn.addEventListener('click', closePanel);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closePanel(); });

  function addProductToList(){
    const name = productName.value.trim();
    if(!name){ productName.focus(); return; }
    const note = productNote.value.trim();

    const list = JSON.parse(localStorage.getItem(LIST_STORAGE_KEY) || '[]');
    const existingIndex = list.findIndex(e => e.name === name && e.category === CATEGORY);
    const entry = { name, category: CATEGORY, qty: 1, unit: 'piece', note: note || undefined, addedAt: Date.now() };
    if(existingIndex > -1){
      list[existingIndex] = entry;
    } else {
      list.push(entry);
    }
    localStorage.setItem(LIST_STORAGE_KEY, JSON.stringify(list));

    closePanel();
    showToast(`${name} — تمت الإضافة إلى اللائحة`);
  }

  saveBtn.addEventListener('click', addProductToList);

  productName.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') saveBtn.click();
  });
</script>

</body>
</html>
