<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أقسام البقالة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top" id="top"></header>

  <section>
    <div class="heading">
      <h1 id="homeTitle">الأقسام</h1>
      <span class="count" id="count" hidden></span>
    </div>
    <p class="lead">اختر قسماً، أو أضف منتجاً من عندك.</p>
    <div class="loadbox" id="loadBox">
      <p id="loadMsg" role="status">جارٍ تحميل المنتجات…</p>
      <button class="btn" type="button" id="retry" hidden>إعادة المحاولة</button>
    </div>
    <main class="grid" id="grid"></main>
  </section>
</div>

<script src="js/art.js"></script>
<script src="js/shared.js"></script>
<script src="js/home.js"></script>
</body>
</html>
